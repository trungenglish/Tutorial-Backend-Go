apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutorial-backend
  labels:
    app: tutorial-backend
spec:
    replicas: 2
    selector:
      matchLabels:
        app: tutorial-backend
    template:
      metadata:
        labels:
          app: tutorial-backend
      spec:
        containers:
        - name: tutorial-backend
          image: trungenglish/tutorial-backend:1.0
          ports:
          - containerPort: 8080
          envFrom:
          - configMapRef:
              name: tutorial-config
          - secretRef:
              name: tutorial-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20