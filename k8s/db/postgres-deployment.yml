apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutorial-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tutorial-postgres
  template:
    metadata:
      labels:
        app: tutorial-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tutorial
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tutorial-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tutorial-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc